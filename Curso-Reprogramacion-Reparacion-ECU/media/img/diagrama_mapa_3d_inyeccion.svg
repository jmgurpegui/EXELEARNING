<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="900" height="480" fill="#f8fafc" rx="12" stroke="#cbd5e1" stroke-width="2"/>
  <defs>
    <linearGradient id="map-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="35%" stop-color="#10b981"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="mesh-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Título Superior -->
  <rect x="25" y="18" width="850" height="42" rx="8" fill="#0f172a"/>
  <text x="450" y="45" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="1">ESTRUCTURA DE UN MAPA DE GESTIÓN MOTOR (3D SURFACE)</text>

  <!-- Gráfico Isométrico 3D -->
  <g transform="translate(60, 100)">
    <!-- Ejes de Coordenadas -->
    <!-- Eje X: RPM (Hacia la derecha-abajo) -->
    <line x1="120" y1="280" x2="480" y2="280" stroke="#0f172a" stroke-width="2.5"/>
    <text x="500" y="285" font-size="12" font-weight="700" fill="#0f172a">Eje X: Régimen Motor (RPM: 800 - 4500)</text>

    <!-- Eje Y: Carga / Masa Aire (Hacia la izquierda-abajo) -->
    <line x1="120" y1="280" x2="20" y2="170" stroke="#0f172a" stroke-width="2.5"/>
    <text x="15" y="150" font-size="12" font-weight="700" fill="#0f172a">Eje Y: Carga / MAF (mg/H)</text>

    <!-- Eje Z: Altura / Caudal Inyectado o Par (Vertical) -->
    <line x1="120" y1="280" x2="120" y2="40" stroke="#dc2626" stroke-width="2.5"/>
    <polygon points="120,30 115,45 125,45" fill="#dc2626"/>
    <text x="125" y="35" font-size="12" font-weight="700" fill="#dc2626">Eje Z: Caudal (mg/ciclo) o Par (Nm)</text>

    <!-- Superficie del Mapa (Polígonos 3D estilizados con gradiente) -->
    <!-- Curva de Par / Inyección -->
    <polygon points="
      50,190  120,200  200,160  300,120  400,140  460,190
      460,250 400,210  300,180  200,220  120,260  50,230
    " fill="url(#map-grad)" opacity="0.88" stroke="#1e293b" stroke-width="1.5" filter="url(#mesh-shadow)"/>

    <!-- Líneas de Malla (Grid lines) sobre la superficie -->
    <path d="M 50,190 L 460,190" stroke="#ffffff" stroke-width="1" stroke-dasharray="2,2"/>
    <path d="M 50,210 L 460,210" stroke="#ffffff" stroke-width="1" stroke-dasharray="2,2"/>
    <path d="M 120,200 L 120,260" stroke="#ffffff" stroke-width="1" stroke-dasharray="2,2"/>
    <path d="M 200,160 L 200,220" stroke="#ffffff" stroke-width="1.5"/>
    <path d="M 300,120 L 300,180" stroke="#ffffff" stroke-width="2"/>
    <path d="M 400,140 L 400,210" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Puntos de Calibración Destacados -->
    <circle cx="300" cy="120" r="5" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <text x="305" y="112" font-size="10" font-weight="700" fill="#7f1d1d">Punto Máx. Par: 2200 RPM / 75 mg</text>

    <circle cx="120" cy="200" r="5" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="125" y="195" font-size="10" font-weight="700" fill="#1e3a8a">Ralentí: 850 RPM / 6.5 mg</text>
  </g>

  <!-- Panel Lateral Informativo -->
  <g transform="translate(560, 90)">
    <rect width="310" height="360" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="310" height="34" rx="8" fill="#0284c7"/>
    <text x="155" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">PARÁMETROS DEL MAPA EN FLASH</text>

    <text x="15" y="60" font-size="12" font-weight="700" fill="#0f172a">Formato Binario en WinOLS / Damos:</text>
    <text x="15" y="78" font-size="11" fill="#334155">Dimensión típica: 16x16 o 12x16 celdas</text>
    <text x="15" y="96" font-size="11" fill="#334155">Codificación: 16 bits (Word / 2 bytes) Lo-Hi</text>

    <line x1="15" y1="110" x2="295" y2="110" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="15" y="130" font-size="12" font-weight="700" fill="#0f172a">Factores de Conversión y Offset:</text>
    <text x="15" y="150" font-size="11" fill="#475569">RPM : Factor 1.0 / Offset 0</text>
    <text x="15" y="168" font-size="11" fill="#475569">Caudal (IQ) : Factor 0.01 (mg/stroke)</text>
    <text x="15" y="186" font-size="11" fill="#475569">Presión Turbo : Factor 1.0 (mbar) o 0.05</text>
    <text x="15" y="204" font-size="11" fill="#475569">Avance SOI : Factor 0.023437 (° cigüeñal)</text>

    <line x1="15" y1="220" x2="295" y2="220" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="15" y="235" width="280" height="105" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="25" y="255" font-size="11" font-weight="700" fill="#b91c1c">⚠ REGLA DE ORO DEL CHECKSUM:</text>
    <text x="25" y="273" font-size="10" fill="#7f1d1d">Cualquier byte modificado en la matriz</text>
    <text x="25" y="289" font-size="10" fill="#7f1d1d">altera la suma criptográfica del bloque.</text>
    <text x="25" y="307" font-size="10" font-weight="700" fill="#991b1b">El Checksum DEBE ser recalculado</text>
    <text x="25" y="323" font-size="10" fill="#7f1d1d">antes de escribir en la memoria de la UCE.</text>
  </g>
</svg>
