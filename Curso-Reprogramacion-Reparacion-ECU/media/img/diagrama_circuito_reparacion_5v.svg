<svg viewBox="0 0 900 450" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="900" height="450" fill="#f8fafc" rx="12" stroke="#cbd5e1" stroke-width="2"/>
  <defs>
    <filter id="box-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.07"/>
    </filter>
  </defs>

  <!-- Título Superior -->
  <rect x="25" y="18" width="850" height="42" rx="8" fill="#1e293b"/>
  <text x="450" y="45" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="1">CIRCUITO INTERNO DE 5,0 V PARA SENSORES Y PROTOCOLO DE REPARACIÓN</text>

  <!-- Zona Interna ECU (Izquierda) -->
  <rect x="40" y="80" width="460" height="340" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4" filter="url(#box-shadow)"/>
  <text x="60" y="105" font-size="12" font-weight="700" fill="#64748b">INTERIOR DE LA UCE / PLACA PCB</text>

  <!-- Zona Externa Motor (Derecha) -->
  <rect x="540" y="80" width="320" height="340" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4" filter="url(#box-shadow)"/>
  <text x="560" y="105" font-size="12" font-weight="700" fill="#64748b">VANO MOTOR / MAZO DE CABLES</text>

  <!-- Conector ECU Separador Central -->
  <line x1="520" y1="90" x2="520" y2="400" stroke="#0f172a" stroke-width="3"/>
  <rect x="505" y="130" width="30" height="40" rx="4" fill="#0f172a"/>
  <text x="520" y="155" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">PIN 5V</text>

  <rect x="505" y="270" width="30" height="40" rx="4" fill="#0f172a"/>
  <text x="520" y="295" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">GND</text>

  <!-- Entrada +12V Bat -->
  <path d="M 60 150 L 120 150" stroke="#dc2626" stroke-width="3"/>
  <circle cx="60" cy="150" r="4" fill="#dc2626"/>
  <text x="60" y="140" font-size="11" font-weight="700" fill="#dc2626">+12V Bat</text>

  <!-- Diodo Protección Inversión Polaridad -->
  <g transform="translate(120, 135)">
    <rect width="40" height="30" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <polygon points="12,7 28,15 12,23" fill="#dc2626"/>
    <line x1="28" y1="7" x2="28" y2="23" stroke="#dc2626" stroke-width="2"/>
    <text x="20" y="-4" text-anchor="middle" font-size="9" font-weight="700" fill="#991b1b">D1 Schottky</text>
  </g>

  <!-- Línea hacia Regulador -->
  <line x1="160" y1="150" x2="210" y2="150" stroke="#dc2626" stroke-width="3"/>

  <!-- Chip Regulador de Tensión 5.0V (LDO / PMIC Bosch) -->
  <g transform="translate(210, 120)">
    <rect width="140" height="90" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="70" y="25" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">REGULADOR 5V</text>
    <text x="70" y="42" text-anchor="middle" font-size="10" fill="#3b82f6">Bosch 30344 / TLE4267</text>
    <text x="70" y="62" text-anchor="middle" font-size="9" fill="#475569">Entrada: 12V</text>
    <text x="70" y="78" text-anchor="middle" font-size="10" font-weight="700" fill="#047857">Salida: 5.00 V ± 1%</text>
  </g>

  <!-- Salida de 5.0V hacia Conector -->
  <line x1="350" y1="150" x2="505" y2="150" stroke="#16a34a" stroke-width="3"/>
  <text x="420" y="142" font-size="11" font-weight="700" fill="#16a34a">+5.0 V Ref</text>

  <!-- Condensador de Filtrado y Diodo TVS en placa -->
  <g transform="translate(420, 175)">
    <!-- Condensador SMD -->
    <line x1="10" y1="-25" x2="10" y2="0" stroke="#16a34a" stroke-width="2"/>
    <line x1="0" y1="0" x2="20" y2="0" stroke="#0f172a" stroke-width="2"/>
    <line x1="0" y1="6" x2="20" y2="6" stroke="#0f172a" stroke-width="2"/>
    <line x1="10" y1="6" x2="10" y2="35" stroke="#475569" stroke-width="2"/>
    <text x="25" y="8" font-size="9" fill="#475569">C1 (10µF)</text>
  </g>

  <!-- Línea de Masa (GND) -->
  <line x1="100" y1="290" x2="505" y2="290" stroke="#475569" stroke-width="3"/>
  <text x="130" y="308" font-size="11" font-weight="700" fill="#475569">Masa de Potencia (GND)</text>

  <!-- En el Mazo Exterior: Sensor y Avería Típica -->
  <g transform="translate(580, 130)">
    <rect width="180" height="90" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
    <text x="90" y="25" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">SENSOR MOTOR</text>
    <text x="90" y="45" text-anchor="middle" font-size="10" fill="#475569">Sensor MAP / Presión Raíl</text>
    <text x="90" y="65" text-anchor="middle" font-size="9" fill="#64748b">Elemento piezorresistivo</text>
  </g>

  <line x1="535" y1="150" x2="580" y2="150" stroke="#16a34a" stroke-width="3"/>
  <line x1="535" y1="290" x2="580" y2="290" stroke="#475569" stroke-width="3"/>

  <!-- Punto de Cortocircuito a Chasis (Rayo rojo) -->
  <g transform="translate(640, 230)">
    <polygon points="10,0 2,18 12,18 6,36 24,14 14,14 20,0" fill="#ef4444" stroke="#b91c1c" stroke-width="1"/>
    <text x="32" y="15" font-size="11" font-weight="700" fill="#dc2626">AVERÍA COMÚN EN TALLER:</text>
    <text x="32" y="32" font-size="10" fill="#991b1b">Cable de 5V rozado con chasis</text>
    <text x="32" y="46" font-size="10" fill="#991b1b">o sensor en cortocircuito interno.</text>
  </g>

  <!-- Resumen de Protocolo de Comprobación -->
  <g transform="translate(60, 345)">
    <rect width="380" height="65" rx="6" fill="#fefce8" stroke="#eab308"/>
    <text x="15" y="20" font-size="11" font-weight="700" fill="#854d0e">PROTOCOLO DE DIAGNÓSTICO EN BANCO:</text>
    <text x="15" y="38" font-size="10" fill="#713f12">1. Desconectar sensores: ¿sube la tensión a 5V? -> Corto exterior.</text>
    <text x="15" y="54" font-size="10" fill="#713f12">2. Si sigue en 0V en banco -> Medir resistencia a masa. Si &lt;10Ω -> Sustituir regulador IC.</text>
  </g>
</svg>
