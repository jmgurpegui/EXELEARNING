<svg viewBox="0 0 920 480" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="920" height="480" fill="#f8fafc" rx="12" stroke="#cbd5e1" stroke-width="2"/>
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Título Superior -->
  <rect x="25" y="18" width="870" height="42" rx="8" fill="#1e293b"/>
  <text x="460" y="45" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="1">LOS 4 MÉTODOS DE LECTURA Y ESCRITURA (FLASHEO) DE UNA ECU</text>

  <!-- Método 1: OBD-II -->
  <g transform="translate(25, 75)">
    <rect width="205" height="380" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2" filter="url(#card-shadow)"/>
    <rect width="205" height="40" rx="10" fill="#3b82f6"/>
    <text x="102" y="25" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1. POR PUERTO OBD-II</text>
    
    <rect x="20" y="55" width="165" height="60" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="102" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">Toma DLC 16 Pines</text>
    <text x="102" y="98" text-anchor="middle" font-size="10" fill="#3b82f6">Pines 6 y 14 (CAN) / 7 (K-Line)</text>
    
    <text x="15" y="140" font-size="11" font-weight="700" fill="#0f172a">Características clave:</text>
    <text x="15" y="160" font-size="10" fill="#334155">✔ Sin desmontar la centralita</text>
    <text x="15" y="178" font-size="10" fill="#334155">✔ Rapidez máxima en taller</text>
    <text x="15" y="196" font-size="10" fill="#334155">✔ Virtual Read (VR) en nube</text>
    
    <rect x="12" y="215" width="180" height="85" rx="6" fill="#fef2f2" stroke="#fecaca"/>
    <text x="20" y="235" font-size="11" font-weight="700" fill="#dc2626">Riesgos y Limitaciones:</text>
    <text x="20" y="253" font-size="9" fill="#991b1b">✘ Solo lee zona de calibración</text>
    <text x="20" y="269" font-size="9" fill="#991b1b">✘ NO lee EEPROM completa</text>
    <text x="20" y="285" font-size="9" fill="#991b1b">✘ Si corta: ECU bloqueada</text>

    <rect x="12" y="315" width="180" height="45" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="102" y="335" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">Exige estabilizador:</text>
    <text x="102" y="350" text-anchor="middle" font-size="10" font-weight="700" fill="#dc2626">13.8V - 14.4V (70A - 100A)</text>
  </g>

  <!-- Método 2: BENCH MODE -->
  <g transform="translate(245, 75)">
    <rect width="205" height="380" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#card-shadow)"/>
    <rect width="205" height="40" rx="10" fill="#10b981"/>
    <text x="102" y="25" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2. BENCH MODE (BANCO)</text>
    
    <rect x="20" y="55" width="165" height="60" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="102" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">Conector Exterior ECU</text>
    <text x="102" y="98" text-anchor="middle" font-size="10" fill="#059669">Sin abrir la carcasa sellada</text>
    
    <text x="15" y="140" font-size="11" font-weight="700" fill="#0f172a">Características clave:</text>
    <text x="15" y="160" font-size="10" fill="#334155">✔ VCC (+12V permanente, IGN)</text>
    <text x="15" y="178" font-size="10" fill="#334155">✔ Masa GND + CAN-H / CAN-L</text>
    <text x="15" y="196" font-size="10" fill="#047857">✔ Pines GPT1 / GPT2 (TriCore)</text>
    
    <rect x="12" y="215" width="180" height="85" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="20" y="235" font-size="11" font-weight="700" fill="#15803d">Ventajas profesionales:</text>
    <text x="20" y="253" font-size="9" fill="#166534">✔ Copia de seguridad COMPLETA</text>
    <text x="20" y="269" font-size="9" fill="#166534">✔ Lee Flash + EEPROM íntegra</text>
    <text x="20" y="285" font-size="9" fill="#166534">✔ Seguro contra brickeos</text>

    <rect x="12" y="315" width="180" height="45" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="102" y="335" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">Protocolo preferente:</text>
    <text x="102" y="350" text-anchor="middle" font-size="10" font-weight="700" fill="#059669">Clonación Bosch EDC17/MED17</text>
  </g>

  <!-- Método 3: BOOT MODE -->
  <g transform="translate(465, 75)">
    <rect width="205" height="380" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2" filter="url(#card-shadow)"/>
    <rect width="205" height="40" rx="10" fill="#f59e0b"/>
    <text x="102" y="25" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3. BOOT MODE (ARRANQUE)</text>
    
    <rect x="20" y="55" width="165" height="60" rx="6" fill="#fffbeb" stroke="#fde68a"/>
    <text x="102" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">Apertura de Carcasa</text>
    <text x="102" y="98" text-anchor="middle" font-size="10" fill="#d97706">Resistencia Boot a Masa</text>
    
    <text x="15" y="140" font-size="11" font-weight="700" fill="#0f172a">Características clave:</text>
    <text x="15" y="160" font-size="10" fill="#334155">✔ Puente a pad de arranque</text>
    <text x="15" y="178" font-size="10" fill="#334155">✔ Resistencia típica: 1 kΩ</text>
    <text x="15" y="196" font-size="10" fill="#334155">✔ Fuerza el micro a modo boot</text>
    
    <rect x="12" y="215" width="180" height="85" rx="6" fill="#fefce8" stroke="#fef08a"/>
    <text x="20" y="235" font-size="11" font-weight="700" fill="#854d0e">Uso en Taller:</text>
    <text x="20" y="253" font-size="9" fill="#713f12">✔ Recuperación de ECUs muertas</text>
    <text x="20" y="269" font-size="9" fill="#713f12">✔ Flasheo de microcontroladores</text>
    <text x="20" y="285" font-size="9" fill="#713f12">✔ Requiere sellado posterior</text>

    <rect x="12" y="315" width="180" height="45" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="102" y="335" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">Cuidado mecánico:</text>
    <text x="102" y="350" text-anchor="middle" font-size="10" font-weight="700" fill="#b45309">No doblar PCB al despegar</text>
  </g>

  <!-- Método 4: BDM / JTAG -->
  <g transform="translate(685, 75)">
    <rect width="205" height="380" rx="10" fill="#ffffff" stroke="#8b5cf6" stroke-width="2" filter="url(#card-shadow)"/>
    <rect width="205" height="40" rx="10" fill="#8b5cf6"/>
    <text x="102" y="25" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4. BDM / JTAG / NEXUS</text>
    
    <rect x="20" y="55" width="165" height="60" rx="6" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="102" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">Bastidor con Agujas Pogo</text>
    <text x="102" y="98" text-anchor="middle" font-size="10" fill="#7c3aed">Puerto BDM directo en placa</text>
    
    <text x="15" y="140" font-size="11" font-weight="700" fill="#0f172a">Características clave:</text>
    <text x="15" y="160" font-size="10" fill="#334155">✔ Acceso a bus de depuración</text>
    <text x="15" y="178" font-size="10" fill="#334155">✔ MPC555/565, MPC5xxx, TriCore</text>
    <text x="15" y="196" font-size="10" fill="#334155">✔ Conexión por muelles sin soldar</text>
    
    <rect x="12" y="215" width="180" height="85" rx="6" fill="#faf5ff" stroke="#f3e8ff"/>
    <text x="20" y="235" font-size="11" font-weight="700" fill="#5b21b6">Nivel de copia:</text>
    <text x="20" y="253" font-size="9" fill="#4c1d95">✔ Clonación 100% Bit a Bit</text>
    <text x="20" y="269" font-size="9" fill="#4c1d95">✔ Micro + Flash ext. + EEPROM</text>
    <text x="20" y="285" font-size="9" fill="#4c1d95">✔ El método de rescate definitivo</text>

    <rect x="12" y="315" width="180" height="45" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="102" y="335" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">Equipamiento:</text>
    <text x="102" y="350" text-anchor="middle" font-size="10" font-weight="700" fill="#6d28d9">K-Tag, Trasdata, Flex, Dimsport</text>
  </g>
</svg>
